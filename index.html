<!DOCTYPE html>  
<html lang="es">  
<head>  
  <meta charset="UTF-8">  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  
  <title>Cancionero Iglesia de Dios 7d</title>  
  
  <link rel="apple-touch-icon" href="icon.png">  
  <meta name="apple-mobile-web-app-capable" content="yes">  
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">  
  <link rel="manifest" href="manifest.json">  
  <meta name="theme-color" content="#0b0f19">  

  <style>  
    :root {  
      --bg: #0b0f19;  
      --card: #151c2c;  
      --card-border: #1e293b;  
      --text: #f8fafc;  
      --text-muted: #94a3b8;  
      --accent: #3b82f6;  
      --accent-green: #10b981;  
      --chord: #38bdf8;  
      --badge-bg: #1e293b;  
      --danger: #ef4444;  
      --block-bg: #111827;
    }  

    body.light-mode {  
      --bg: #f8fafc;  
      --card: #ffffff;  
      --card-border: #e2e8f0;  
      --text: #0f172a;  
      --text-muted: #64748b;  
      --accent: #2563eb;  
      --chord: #0284c7;  
      --badge-bg: #e2e8f0;  
      --block-bg: #f1f5f9;
    }  

    body {  
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;  
      background-color: var(--bg);  
      color: var(--text);  
      margin: 0;  
      padding: 16px;  
      transition: background-color 0.3s, color 0.3s;  
    }  

    .container { max-width: 600px; margin: 0 auto; }  

    header {  
      display: flex;  
      justify-content: space-between;  
      align-items: flex-start;  
      margin-bottom: 12px;  
    }  

    .brand-title { font-size: 22px; font-weight: 800; color: var(--text); margin: 0; }
    .brand-subtitle { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

    .status-bar {  
      display: flex;  
      justify-content: space-between;  
      align-items: center;  
      margin-bottom: 16px;  
      padding: 8px 12px;  
      background: var(--card);  
      border: 1px solid var(--card-border);  
      border-radius: 10px;  
      font-size: 12px;  
    }  

    .badge-online { color: var(--accent-green); font-weight: bold; }  
    .badge-offline { color: var(--danger); font-weight: bold; }  

    .search-bar {  
      width: 100%;  
      padding: 12px 16px;  
      font-size: 15px;  
      border: 1px solid var(--card-border);  
      border-radius: 12px;  
      background: var(--card);  
      color: var(--text);  
      box-sizing: border-box;  
      margin-bottom: 16px;  
      outline: none;  
    }  

    .tabs-bar {  
      display: flex;  
      gap: 8px;  
      margin-bottom: 16px;  
    }  

    .tab-btn {  
      flex: 1;  
      padding: 12px;  
      background: var(--card);  
      border: 1px solid var(--card-border);  
      border-radius: 12px;  
      color: var(--text-muted);  
      font-weight: 700;  
      cursor: pointer;  
      text-align: center;  
      font-size: 14px;  
    }  

    .tab-btn.active {  
      background: var(--accent);  
      color: white;  
      border-color: var(--accent);  
    }  

    .song-list { display: flex; flex-direction: column; gap: 10px; }  

    .song-card {  
      background: var(--card);  
      padding: 14px 16px;  
      border-radius: 12px;  
      border: 1px solid var(--card-border);  
      display: flex;  
      justify-content: space-between;  
      align-items: center;  
    }  

    .song-card-info { flex-grow: 1; cursor: pointer; }  
    .song-card-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }  
    .song-card-author { font-size: 12px; color: var(--text-muted); }  

    .badge-key {  
      background: var(--badge-bg);  
      color: var(--accent);  
      padding: 4px 8px;  
      border-radius: 6px;  
      font-size: 12px;  
      font-weight: 700;  
    }  

    .btn-set {  
      background: transparent;  
      border: 1px solid var(--card-border);  
      color: var(--text-muted);  
      padding: 6px 10px;  
      border-radius: 8px;  
      cursor: pointer;  
      font-size: 14px;  
      margin-left: 8px;  
    }  

    .btn-set.active { color: #f59e0b; border-color: #f59e0b; }  

    /* VIEWER */  
    .viewer, .editor, .live-viewer { display: none; }  

    .song-header { margin-bottom: 16px; }  
    .song-title-large { font-size: 26px; font-weight: 800; margin: 0 0 6px 0; }  
    .song-meta-tags { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }  

    .meta-tag {  
      background: var(--card);  
      border: 1px solid var(--card-border);  
      padding: 4px 10px;  
      border-radius: 8px;  
      font-size: 12px;  
      font-weight: 600;  
    }  

    .controls-bar {  
      background: var(--card);  
      border: 1px solid var(--card-border);  
      border-radius: 12px;  
      padding: 8px 12px;  
      display: flex;  
      justify-content: space-between;  
      align-items: center;  
      margin-bottom: 12px;  
    }  

    .btn-action {  
      background: var(--card);  
      color: var(--text);  
      border: 1px solid var(--card-border);  
      padding: 8px 12px;  
      border-radius: 8px;  
      font-size: 13px;  
      font-weight: 600;  
      cursor: pointer;  
    }  

    .btn-action.primary { background: var(--accent); color: white; border: none; }  

    /* DISEÑO POR BLOQUES MODERNO */
    .song-block {
      background: var(--block-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 14px;
    }

    .block-label {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--accent);
      background: rgba(59, 130, 246, 0.15);
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .line-pair {
      font-family: "Courier New", Courier, monospace;
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 10px;
      white-space: pre-wrap;
    }

    .chord-line { color: var(--chord); font-weight: 700; }
    .text-line { color: var(--text); }

    /* MENU HERRAMIENTAS SEGURO */
    .admin-menu {
      margin-top: 30px;
      padding: 12px;
      background: var(--card);
      border: 1px dashed var(--card-border);
      border-radius: 12px;
      text-align: center;
    }

    .admin-actions {
      display: none;
      gap: 8px;
      justify-content: center;
      margin-top: 10px;
    }

    /* EDITOR CON HIGHLIGHT EN VIVO */
    .editor-container {
      position: relative;
      width: 100%;
      height: 320px;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      background: var(--card);
      margin-bottom: 16px;
      overflow: hidden;
    }

    .editor-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      padding: 12px;
      font-family: "Courier New", Courier, monospace;
      font-size: 15px;
      line-height: 1.5;
      box-sizing: border-box;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-y: auto;
    }

    #edit-raw {
      color: transparent;
      caret-color: var(--text);
      background: transparent;
      z-index: 2;
      border: none;
      outline: none;
      resize: none;
    }

    #edit-preview {
      z-index: 1;
      color: var(--text);
      pointer-events: none;
    }

    .highlight-chord { color: var(--chord); font-weight: bold; }

    /* VISTA EN VIVO (PROYECCIÓN) */
    .live-screen {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #000;
      color: #fff;
      z-index: 9999;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .live-text {
      font-size: 32px;
      font-weight: 700;
      line-height: 1.4;
      white-space: pre-line;
    }
  </style>  
</head>  
<body>  

<div class="container">  
  
  <!-- VISTA LISTA -->  
  <div id="list-view">  
    <header>  
      <div>
        <h1 class="brand-title">Cancionero Iglesia de Dios 7d</h1>  
        <div class="brand-subtitle">Alabanzas con transposición</div>
      </div>
      <button class="btn-action" onclick="toggleDarkMode()" id="theme-btn">🌙</button>  
    </header>  

    <div class="status-bar">  
      <span id="connection-status">Cargando...</span>  
      <span id="pending-sync" style="color: #f59e0b;"></span>  
    </div>  

    <div class="tabs-bar">  
      <button class="tab-btn active" id="tab-all" onclick="switchTab('all')">Todas</button>  
      <button class="tab-btn" id="tab-set" onclick="switchTab('set')">★ Mi Set (<span id="set-count">0</span>)</button>  
    </div>  

    <div style="display: flex; gap: 8px;">  
      <input type="text" class="search-bar" id="search-input" placeholder="Buscar título, letra o tono..." oninput="filterSongs()">  
      <button class="btn-action primary" style="height: 45px; white-space: nowrap;" onclick="openEditor()">+ Nuevo</button>  
    </div>  

    <div id="song-container" class="song-list"></div>  
  </div>  

  <!-- VISTA VISOR DE CANCIÓN -->  
  <div id="song-viewer" class="viewer">  
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">  
      <button class="btn-action" onclick="showList()">← Volver</button>  
      <div style="display: flex; gap: 6px;">  
        <button class="btn-action primary" onclick="openLiveView()">📺 En Vivo</button>  
        <button class="btn-action" onclick="toggleNotation()" id="notation-btn">C»Do</button>  
      </div>  
    </div>  

    <div class="song-header">  
      <h2 class="song-title-large" id="song-title"></h2>  
      <div class="song-meta-tags">  
        <span class="meta-tag">Tono: <strong id="current-key-display" style="color: var(--accent);"></strong></span>  
        <span class="meta-tag" id="song-author"></span>  
      </div>  
    </div>  

    <!-- Transposición -->  
    <div class="controls-bar">  
      <span style="font-size: 13px; font-weight: 600;">Transponer:</span>  
      <div style="display: flex; gap: 4px;">  
        <button class="btn-action" onclick="transpose(-2)">-1</button>  
        <button class="btn-action" onclick="transpose(-1)">-½</button>  
        <button class="btn-action" onclick="resetKey()">Orig</button>  
        <button class="btn-action" onclick="transpose(1)">+½</button>  
        <button class="btn-action" onclick="transpose(2)">+1</button>  
      </div>  
    </div>  

    <!-- Scroll & Fuente -->  
    <div class="controls-bar">  
      <button class="btn-action primary" id="scroll-toggle-btn" onclick="toggleAutoScroll()">▶ Auto-Scroll</button>  
      <div style="display: flex; align-items: center; gap: 6px;">  
        <button class="btn-action" onclick="changeScrollSpeed(-1)">-</button>  
        <span id="scroll-speed-display" style="font-size: 13px; font-weight: bold; width: 20px; text-align: center;">1x</span>  
        <button class="btn-action" onclick="changeScrollSpeed(1)">+</button>  
        <button class="btn-action" onclick="changeFontSize(-1)">A-</button>  
        <button class="btn-action" onclick="changeFontSize(1)">A+</button>  
      </div>  
    </div>  

    <div id="song-content"></div>  

    <!-- Menú de Administración Protegido -->
    <div class="admin-menu">
      <button class="btn-action" style="width:100%; border:none; background:transparent;" onclick="toggleAdminActions()">⚙️ Opciones de Edición</button>
      <div id="admin-actions" class="admin-actions">
        <button class="btn-action" onclick="editCurrentSong()">✏️ Editar Canción</button>  
        <button class="btn-action" onclick="deleteCurrentSong()" style="color: var(--danger);">🗑️ Eliminar Canción</button>  
      </div>
    </div>
  </div>  

  <!-- VISTA EDITOR -->  
  <div id="song-editor" class="editor">  
    <button class="btn-action" onclick="showList()" style="margin-bottom: 12px;">← Cancelar</button>  
    <h2 id="editor-heading" style="margin-top:0;">Agregar Nueva Canción</h2>  

    <input type="text" class="search-bar" id="edit-title" placeholder="Título de la canción">  
    <input type="text" class="search-bar" id="edit-author" placeholder="Autor / Grupo (Opcional)">  

    <div class="editor-container">  
      <div id="edit-preview" class="editor-layer"></div>
      <textarea id="edit-raw" class="editor-layer" placeholder="G               C&#10;Señor mi Dios al contemplar los cielos..." oninput="handleEditorInput()"></textarea>  
    </div>  

    <button class="btn-action primary" style="width: 100%; padding: 14px;" onclick="saveSong()">Guardar Canción</button>  
  </div>  

</div>  

<!-- PANTALLA EN VIVO / PROYECCIÓN -->
<div id="live-screen" class="live-screen" style="display:none;" onclick="closeLiveView()">
  <div class="live-text" id="live-text-content"></div>
  <div style="position:absolute; bottom:20px; font-size:12px; opacity:0.6;">Toca la pantalla para salir</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>  
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>  

<script>  
  const firebaseConfig = {  
    apiKey: "AIzaSyDurPYIt-Ds8dKb48wu56fgxy7_8FwKsus",  
    authDomain: "cancionero-iglesia-7560f.firebaseapp.com",  
    projectId: "cancionero-iglesia-7560f",  
    storageBucket: "cancionero-iglesia-7560f.firebasestorage.app",  
    messagingSenderId: "85490280451",  
    appId: "1:85490280451:web:ce95de7717027d1dff8636"  
  };  

  let db = null;  
  let songsCollection = null;  

  try {  
    if (typeof firebase !== 'undefined') {  
      firebase.initializeApp(firebaseConfig);  
      db = firebase.firestore();  
      db.enablePersistence().catch(() => {});  
      songsCollection = db.collection('songs');  
    }  
  } catch (e) {}  

  const scaleA = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];  
  const angloToLatinoMap = { 'C':'Do', 'D':'Re', 'E':'Mi', 'F':'Fa', 'G':'Sol', 'A':'La', 'B':'Si', 'C#':'Do#', 'D#':'Re#', 'F#':'Fa#', 'G#':'Sol#', 'A#':'La#', 'Db':'Reb', 'Eb':'Mib', 'Gb':'Solb', 'Ab':'Lab', 'Bb':'Sib' };  
  const latinoToAngloMap = { 'DO':'C', 'RE':'D', 'MI':'E', 'FA':'F', 'SOL':'G', 'LA':'A', 'SI':'B', 'DO#':'C#', 'RE#':'D#', 'FA#':'F#', 'SOL#':'G#', 'LA#':'A#' };  

  let songs = [];  
  let songSetIds = JSON.parse(localStorage.getItem('church_song_set') || '[]');  
  let currentTab = 'all';  
  let currentSong = null;  
  let editingSongId = null;  
  let currentTransposeSteps = 0;  
  let useLatinoNotation = false;  
  let scrollInterval = null;  
  let isScrolling = false;  
  let scrollSpeed = 1;  
  let currentFontSize = 16;  

  if ('serviceWorker' in navigator) {  
    navigator.serviceWorker.register('sw.js').catch(() => {});  
  }  

  function listenToSongs() {  
    loadLocalSongs();  
    if (songsCollection) {  
      songsCollection.orderBy('title').onSnapshot(snapshot => {  
        songs = [];  
        snapshot.forEach(doc => songs.push({ id: doc.id, ...doc.data() }));  
        localStorage.setItem('church_songs', JSON.stringify(songs));  
        if (document.getElementById('list-view').style.display !== 'none') renderCurrentTab();  
        updateSyncStatus();  
      }, () => updateSyncStatus());  
    } else {  
      updateSyncStatus();  
    }  
  }  

  function loadLocalSongs() {  
    const saved = localStorage.getItem('church_songs');  
    if (saved) { songs = JSON.parse(saved); renderCurrentTab(); }  
  }  

  function updateSyncStatus() {  
    const statusEl = document.getElementById('connection-status');  
    const syncEl = document.getElementById('pending-sync');  
    if (navigator.onLine && songsCollection) {  
      statusEl.innerHTML = '<span class="badge-online">● En línea</span>';  
      syncEl.innerText = '';  
    } else {  
      statusEl.innerHTML = '<span class="badge-offline">● Modo Offline</span>';  
      syncEl.innerText = 'Cargado localmente';  
    }  
  }  

  window.addEventListener('online', updateSyncStatus);  
  window.addEventListener('offline', updateSyncStatus);  

  function switchTab(tab) {  
    currentTab = tab;  
    document.getElementById('tab-all').classList.toggle('active', tab === 'all');  
    document.getElementById('tab-set').classList.toggle('active', tab === 'set');  
    renderCurrentTab();  
  }  

  function toggleSetItem(e, id) {  
    e.stopPropagation();  
    if (songSetIds.includes(id)) {  
      songSetIds = songSetIds.filter(item => item !== id);  
    } else {  
      songSetIds.push(id);  
    }  
    localStorage.setItem('church_song_set', JSON.stringify(songSetIds));  
    renderCurrentTab();  
  }  

  function renderCurrentTab() {  
    document.getElementById('set-count').innerText = songSetIds.length;  
    let listToRender = currentTab === 'set' ? songs.filter(s => songSetIds.includes(s.id)) : songs;  
    const query = document.getElementById('search-input').value.toLowerCase();  
    
    if (query) {  
      listToRender = listToRender.filter(s =>   
        s.title.toLowerCase().includes(query) ||   
        (s.author && s.author.toLowerCase().includes(query)) ||  
        (s.lines && s.lines.some(l => (l.text && l.text.toLowerCase().includes(query)) || (l.chords && l.chords.toLowerCase().includes(query))))  
      );  
    }  
    renderSongList(listToRender);  
  }  

  function renderSongList(items) {  
    const container = document.getElementById('song-container');  
    container.innerHTML = '';  
    if (items.length === 0) {  
      container.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--text-muted);">No hay canciones registradas.</div>`;  
      return;  
    }  
    items.forEach(song => {  
      const card = document.createElement('div');  
      card.className = 'song-card';  
      const inSet = songSetIds.includes(song.id);  
      card.innerHTML = `  
        <div class="song-card-info" onclick="openSong('${song.id}')">  
          <div class="song-card-title">${song.title}</div>  
          <div class="song-card-author">${song.author || 'Iglesia de Dios 7d'}</div>  
        </div>  
        <div style="display:flex; align-items:center;">  
          <span class="badge-key">${formatKeyDisplay(song.originalKey)}</span>  
          <button class="btn-set ${inSet ? 'active' : ''}" onclick="toggleSetItem(event, '${song.id}')">  
            ${inSet ? '★' : '☆'}  
          </button>  
        </div>  
      `;  
      container.appendChild(card);  
    });  
  }  

  function filterSongs() { renderCurrentTab(); }  

  function formatKeyDisplay(key) {  
    if (!key) return 'C';  
    return useLatinoNotation ? (angloToLatinoMap[key] || key) : key;  
  }  

  const CHORD_REGEX = /^([A-G]|DO|RE|MI|FA|SOL|LA|SI)[#b]?(m|maj|min|dim|aug|sus)?[0-9]?(\/([A-G]|DO|RE|MI|FA|SOL|LA|SI)[#b]?)?$/i;  
  function isChordToken(token) { return token ? CHORD_REGEX.test(token.trim()) : false; }  
  function isChordLine(line) {  
    const tokens = line.trim().split(/\s+/);  
    if (!tokens.length || tokens[0] === "") return false;  
    let chordCount = 0;  
    tokens.forEach(t => { if (isChordToken(t)) chordCount++; });  
    return (chordCount / tokens.length) >= 0.5;  
  }  

  function normalizeChordToAnglo(chord) {  
    return chord.replace(/([A-Z]+[#b]?)/gi, (m) => latinoToAngloMap[m.toUpperCase()] || m);  
  }  

  function parseRawSong(rawText) {  
    const rawLines = rawText.split('\n');  
    const parsedLines = [];  
    let detectedKey = "C";  
    let firstChordFound = false;  

    for (let i = 0; i < rawLines.length; i++) {  
      let current = rawLines[i];  
      if (isChordLine(current)) {  
        current = current.replace(/([A-ZÑa-z]+[#b]?(?:m|maj|min|dim|aug|sus)?[0-9]?(?:\/[A-ZÑa-z]+[#b]?)?)/gi, (m) => normalizeChordToAnglo(m));  
        if (!firstChordFound) {  
          const firstChord = current.trim().split(/\s+/)[0];  
          const match = firstChord.match(/^([A-G][#b]?)/);  
          if (match) detectedKey = match[1];  
          firstChordFound = true;  
        }  
        const nextLine = rawLines[i + 1];  
        if (nextLine && !isChordLine(nextLine)) {  
          parsedLines.push({ chords: current, text: nextLine });  
          i++;  
        } else {  
          parsedLines.push({ chords: current, text: "" });  
        }  
      } else if (current.trim() !== "") {  
        parsedLines.push({ chords: "", text: current });  
      }  
    }  
    return { lines: parsedLines, key: detectedKey };  
  }  

  function transposeNote(note, steps) {  
    const regex = /^([A-G][#b]?)(.*)/;  
    const match = note.match(regex);  
    if (!match) return note;  
    let root = match[1];  
    let suffix = match[2];  
    const flats = {'Db':'C#', 'Eb':'D#', 'Gb':'F#', 'Ab':'G#', 'Bb':'A#'};  
    if (flats[root]) root = flats[root];  
    let index = scaleA.indexOf(root);  
    if (index === -1) return note;  
    let newIndex = (index + steps) % 12;  
    if (newIndex < 0) newIndex += 12;  
    return scaleA[newIndex] + suffix;  
  }  

  function transposeChordLine(chordLine, steps) {  
    if (!chordLine) return chordLine;  
    let transposed = chordLine;  
    if (steps !== 0) {  
      transposed = chordLine.replace(/([A-G][#b]?(?:m|maj|min|dim|aug|sus)?[0-9]?(?:\/[A-G][#b]?)?)/g, (match) => {  
        if (match.includes('/')) {  
          const parts = match.split('/');  
          return transposeNote(parts[0], steps) + '/' + transposeNote(parts[1], steps);  
        }  
        return transposeNote(match, steps);  
      });  
    }  
    if (useLatinoNotation) {  
      transposed = transposed.replace(/([A-G][#b]?)/g, (m) => angloToLatinoMap[m] || m);  
    }  
    return transposed;  
  }  

  function renderTransposedContent() {  
    if (!currentSong) return;  
    const baseKey = transposeNote(currentSong.originalKey || 'C', currentTransposeSteps);  
    document.getElementById('current-key-display').innerText = formatKeyDisplay(baseKey);  
    const container = document.getElementById('song-content');  
    container.innerHTML = '';  

    if (!currentSong.lines) return;

    let currentBlock = null;
    let blockIndex = 1;

    currentSong.lines.forEach((line, index) => {  
      if (!currentBlock || index % 4 === 0) {
        currentBlock = document.createElement('div');
        currentBlock.className = 'song-block';
        
        const label = document.createElement('div');
        label.className = 'block-label';
        label.innerText = index === 0 ? 'ESTROFA 1' : (index >= 8 ? 'CORO' : `ESTROFA ${blockIndex}`);
        if (index < 8) blockIndex++;
        
        currentBlock.appendChild(label);
        container.appendChild(currentBlock);
      }

      const pair = document.createElement('div');
      pair.className = 'line-pair';

      if (line.chords) {  
        const chordDiv = document.createElement('div');  
        chordDiv.className = 'chord-line';  
        chordDiv.innerText = transposeChordLine(line.chords, currentTransposeSteps);  
        pair.appendChild(chordDiv);  
      }  
      if (line.text) {  
        const textDiv = document.createElement('div');  
        textDiv.className = 'text-line';  
        textDiv.innerText = line.text;  
        pair.appendChild(textDiv);  
      }  

      currentBlock.appendChild(pair);
    });  
  }  

  function transpose(steps) { currentTransposeSteps += steps; renderTransposedContent(); }  
  function resetKey() { currentTransposeSteps = 0; renderTransposedContent(); }  
  function toggleNotation() {  
    useLatinoNotation = !useLatinoNotation;  
    document.getElementById('notation-btn').innerText = useLatinoNotation ? "Do»C" : "C»Do";  
    renderTransposedContent();  
  }  

  function openSong(id) {  
    stopAutoScroll();  
    currentSong = songs.find(s => s.id === id);  
    if (!currentSong) return;  
    currentTransposeSteps = 0;  
    document.getElementById('list-view').style.display = 'none';  
    document.getElementById('song-editor').style.display = 'none';  
    document.getElementById('song-viewer').style.display = 'block';  
    document.getElementById('admin-actions').style.display = 'none';
    document.getElementById('song-title').innerText = currentSong.title;  
    document.getElementById('song-author').innerText = currentSong.author || 'Iglesia de Dios 7d';  
    document.getElementById('song-content').style.fontSize = currentFontSize + 'px';  
    renderTransposedContent();  
    window.scrollTo(0, 0);  
  }  

  function openEditor() {  
    stopAutoScroll();  
    editingSongId = null;  
    document.getElementById('editor-heading').innerText = "Agregar Nueva Canción";  
    document.getElementById('list-view').style.display = 'none';  
    document.getElementById('song-viewer').style.display = 'none';  
    document.getElementById('song-editor').style.display = 'block';  
    document.getElementById('edit-title').value = '';  
    document.getElementById('edit-author').value = '';  
    document.getElementById('edit-raw').value = '';  
    handleEditorInput();
  }  

  function handleEditorInput() {
    const raw = document.getElementById('edit-raw').value;
    const preview = document.getElementById('edit-preview');
    const lines = raw.split('\n');
    
    let html = lines.map(line => {
      if (isChordLine(line)) {
        return `<span class="highlight-chord">${line}</span>`;
      }
      return line;
    }).join('\n');

    preview.innerHTML = html + '\n';
  }

  function toggleAdminActions() {
    const el = document.getElementById('admin-actions');
    el.style.display = el.style.display === 'flex' ? 'none' : 'flex';
  }

  function openLiveView() {
    if (!currentSong) return;
    const liveScreen = document.getElementById('live-screen');
    const liveText = document.getElementById('live-text-content');
    
    let pureLyrics = "";
    if (currentSong.lines) {
      pureLyrics = currentSong.lines.map(l => l.text).filter(t => t.trim() !== "").join('\n');
    }
    
    liveText.innerText = pureLyrics || currentSong.title;
    liveScreen.style.display = 'flex';
  }

  function closeLiveView() {
    document.getElementById('live-screen').style.display = 'none';
  }

  function showList() {  
    stopAutoScroll();  
    document.getElementById('list-view').style.display = 'block';  
    document.getElementById('song-viewer').style.display = 'none';  
    document.getElementById('song-editor').style.display = 'none';  
    renderCurrentTab();  
  }  

  function editCurrentSong() {  
    if (!currentSong) return;  
    editingSongId = currentSong.id;  
    document.getElementById('editor-heading').innerText = "Editar Canción";  
    let rawText = "";  
    if (currentSong.lines) {  
      currentSong.lines.forEach(l => {  
        if (l.chords) rawText += l.chords + "\n";  
        if (l.text) rawText += l.text + "\n";  
      });  
    }  
    document.getElementById('edit-title').value = currentSong.title;  
    document.getElementById('edit-author').value = currentSong.author || '';  
    document.getElementById('edit-raw').value = rawText;  
    document.getElementById('song-viewer').style.display = 'none';  
    document.getElementById('song-editor').style.display = 'block';  
    handleEditorInput();
  }  

  async function deleteCurrentSong() {  
    if (!currentSong) return;  
    if (confirm(`¿Eliminar "${currentSong.title}"?`)) {  
      const deleteId = currentSong.id;  
      songs = songs.filter(s => s.id !== deleteId);  
      localStorage.setItem('church_songs', JSON.stringify(songs));  
      showList();  
      if (songsCollection && !deleteId.startsWith('local_')) {  
        songsCollection.doc(deleteId).delete().catch(() => {});  
      }  
    }  
  }  

  function saveSong() {  
    const title = document.getElementById('edit-title').value.trim();  
    const author = document.getElementById('edit-author').value.trim();  
    const rawText = document.getElementById('edit-raw').value;  
    if (!title || !rawText.trim()) { alert("Ingresa un título y el contenido."); return; }  

    const { lines, key } = parseRawSong(rawText);  
    const newId = editingSongId || ('local_' + Date.now());  
    const songData = { id: newId, title: title, author: author || "Iglesia de Dios 7d", originalKey: key, lines: lines };  

    const index = songs.findIndex(s => s.id === newId);  
    if (index >= 0) songs[index] = songData; else songs.push(songData);  
    localStorage.setItem('church_songs', JSON.stringify(songs));  

    showList();  
    if (songsCollection) {  
      if (editingSongId && !editingSongId.startsWith('local_')) {  
        songsCollection.doc(editingSongId).update(songData);  
      } else {  
        songsCollection.add(songData);  
      }  
    }  
  }  

  function toggleAutoScroll() { isScrolling ? stopAutoScroll() : startAutoScroll(); }  
  function startAutoScroll() {  
    stopAutoScroll();  
    isScrolling = true;  
    document.getElementById('scroll-toggle-btn').innerText = "⏸ Pausa";  
    const delay = Math.max(10, 50 - (scrollSpeed * 8));  
    scrollInterval = setInterval(() => {  
      window.scrollBy(0, 1);  
      if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 10) stopAutoScroll();  
    }, delay);  
  }  

  function stopAutoScroll() {  
    isScrolling = false;  
    if (scrollInterval) clearInterval(scrollInterval);  
    const btn = document.getElementById('scroll-toggle-btn');  
    if (btn) btn.innerText = "▶ Auto-Scroll";  
  }  

  function changeScrollSpeed(delta) {  
    scrollSpeed = Math.max(1, Math.min(5, scrollSpeed + delta));  
    document.getElementById('scroll-speed-display').innerText = scrollSpeed + 'x';  
    if (isScrolling) startAutoScroll();  
  }  

  function changeFontSize(delta) {  
    currentFontSize = Math.max(12, Math.min(28, currentFontSize + delta));  
    document.getElementById('song-content').style.fontSize = currentFontSize + 'px';  
  }  

  function toggleDarkMode() {  
    document.body.classList.toggle('light-mode');  
    const isLight = document.body.classList.contains('light-mode');  
    document.getElementById('theme-btn').innerText = isLight ? '☀️' : '🌙';  
  }  

  document.addEventListener('DOMContentLoaded', () => {  
    listenToSongs();  
  });  
</script>  
</body>  
</html>
